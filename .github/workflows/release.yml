name: Release

# Build and publish the tensorsl distribution to PyPI. Triggered by a `vX.Y.Z`
# tag, which scripts/release.sh creates after bumping the version and changelog.
# A maintainer-pushed tag is the only trigger; `workflow_dispatch` builds the
# sdist for inspection but never publishes.
#
# This ships an sdist only: `pip install tensorsl` builds from source, which
# needs just a Rust toolchain — the core is pure Rust with no system-library
# dependencies. Prebuilt wheels are deferred until a multi-platform build matrix
# is worth the upkeep. The sdist proves the tag -> PyPI path end to end.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip maturin
          maturin sdist -m tsl-py/Cargo.toml --out dist

      # Guard against a forgotten bump: the built version must equal the tag.
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # sdist is <normalized-name>-<version>.tar.gz; strip the name prefix.
          built="$(basename dist/*.tar.gz .tar.gz | sed -E 's/^[^-]+-//')"
          echo "tag=$tag built=$built"
          [ "$tag" = "$built" ] || { echo "::error::tag $tag != built $built"; exit 1; }

      # Build the package from the sdist to prove it installs and imports.
      - name: Smoke test sdist
        run: |
          pip install dist/*.tar.gz
          python -c "import tsl_py; from tsl_py import TSLRegressor; print('import OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Publish only for real tags, never for manual dispatch builds.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC) — no stored token
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
