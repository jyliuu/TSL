name: Docs

# Builds the MkDocs documentation site in strict mode. `--strict` turns broken
# internal links and bad nav entries into errors, so this job is the correctness
# gate for the docs/ folder. It does not deploy; GitHub Pages deployment can be
# added later (mkdocs gh-deploy).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict -f docs/mkdocs.yml
