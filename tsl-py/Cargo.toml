[package]
name = "tsl-py"
version = "0.1.0"
edition = "2021"
authors = ["Jinyang Liu <jl@math.ku.dk>"]
description = "Python bindings for the TSL (Tensor Separation Learning) Rust library."
license = "MIT"
repository = "https://github.com/jyliuu/TSL"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "tsl_py"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.27"
pyo3 = { version = "0.27.1", features = ["extension-module"] }
tsl_rust = { path = "../", default-features = false, features = ["use-rayon", "evo-logging"] }
rand = "0.8.5"
bincode = "1.3"

[features]
use-rayon = ["tsl_rust/use-rayon"]
