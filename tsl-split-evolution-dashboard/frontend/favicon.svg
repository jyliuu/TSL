<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <marker id="ah" markerWidth="5" markerHeight="4" refX="2" refY="2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L5,2 L0,4 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  <!-- isometric axes, origin at exact icon center (32,32); refX<markerWidth pushes the arrow apex past the line endpoint -->
