    points="32,27 31.1,28.2 30.3,30.5 29.4,33.5 28.5,36.5 27.7,38.8 26.8,40 25.9,39.8 25.1,38.5 24.2,36.5 23.3,34.5 22.5,33.2 21.6,33 20.7,34.2 19.9,36.5 19,39.5 18.2,42.5 17.3,44.8 16.4,46 15.6,45.8 14.7,44.5 13.8,42.5 13,40.5 12.1,39.2 11.2,39"/>
  <!-- origin marker at exact icon center -->
  <circle cx="32" cy="32" r="2" fill="#0f172a"/>
</svg>
