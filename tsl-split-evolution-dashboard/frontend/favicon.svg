    <line x1="32" y1="32" x2="32" y2="10" marker-end="url(#ah)"/>
  </g>
  <!-- sine in xz-plane, 2 periods along x-axis -->
  <polyline stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"
    points="32,32 32.9,30 33.7,28.7 34.6,28.5 35.5,29.7 36.3,32 37.2,35 38.1,38 38.9,40.3 39.8,41.5 40.7,41.3 41.5,40 42.4,38 43.3,36 44.1,34.7 45,34.5 45.9,35.7 46.7,38 47.6,41 48.5,44 49.3,46.3 50.2,47.5 51.1,47.3 51.9,46 52.8,44"/>
  <!-- cosine in yz-plane, 2 periods along y-axis -->
